<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mod Reports</title>
<style>
:root{--bg:#090c13;--card:#121826;--line:#212a3b;--tx:#e6eaf4;--mu:#8793ab;--ac:#6f8cff;--gr:#1f9d55;--rd:#c23b3b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 500px at 85% -10%,#1a2146 0%,transparent 60%),linear-gradient(160deg,#080b11,#0c111b 60%,#090c13);background-attachment:fixed}
input,button{font:inherit;color:inherit}
input{background:#0e1420;border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0}
button{background:linear-gradient(180deg,#182036,#111826);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button:disabled{opacity:.55;cursor:default}
[hidden]{display:none!important}
.mu{color:var(--mu)}

#nav{position:fixed;left:0;top:0;bottom:0;width:208px;padding:16px 12px;display:flex;flex-direction:column;gap:6px;z-index:6;
  background:linear-gradient(180deg,#10163a,#0a0e18 70%);border-right:1px solid var(--line)}
.brand{font-weight:700;font-size:17px;padding:4px 10px 14px}
.nv{position:relative;text-align:left;background:none;border:1px solid transparent;padding:10px 12px;border-radius:8px}
.nv small{display:block;color:var(--mu);font-size:12px}
.nv.on{background:linear-gradient(135deg,#3b55c9,#6b44c8);border-color:#7a8cff55}
.nv.on small{color:#ffffffb8}
.bd{position:absolute;right:10px;top:12px;background:#ffffff22;border-radius:10px;padding:0 7px;font-size:12px}
#content{margin-left:208px}
body.open #content{margin-right:380px}

header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:12px 16px;
  background:linear-gradient(90deg,#0b1020d9,#090c13d9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap}
#q{width:200px}
#st{font-size:12px;white-space:nowrap}
main{padding:16px}
h2{margin:0 0 14px;font-size:18px}
h2.sec{margin-top:28px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{display:block;width:100%;min-height:92px;text-align:left;padding:13px;border-radius:6px;background:linear-gradient(145deg,#171f33,#0f1522)}
.tile b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{display:block;color:var(--mu)}
.tile.s-resolved{background:linear-gradient(135deg,#23a85e,#146b3b);border-color:#37c978}
.tile.s-denied{background:linear-gradient(135deg,#d24848,#8f2626);border-color:#e25b5b}
.tile.s-valid{background:linear-gradient(90deg,#1f9d55 12%,#101725 88%);border-color:#37c978}
.tile.s-resolved small,.tile.s-denied small,.tile.s-valid small{color:#ffffffc4}
.tile.sel{outline:2px solid var(--ac)}
.msg{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;word-break:break-word}

.stats{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.stat{padding:16px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(145deg,#171f33,#0f1522)}
.stat .n{font-size:32px;font-weight:700;line-height:1.1}
.stat small{color:var(--mu)}
.stat.o{background:linear-gradient(145deg,#2a3270,#0f1522)}
.stat.g{background:linear-gradient(145deg,#14502f,#0f1522)}
.stat.r{background:linear-gradient(145deg,#5a1f24,#0f1522)}
.stat.v{background:linear-gradient(90deg,#14502f,#0f1522)}

.list{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-left:3px solid #4a5670;border-radius:8px;background:linear-gradient(145deg,#151c2d,#0e1420)}
.row.a-resolved{border-left-color:#2fbf70}
.row.a-denied{border-left-color:#e25b5b}
.row.a-valid{border-left-color:#8bd3a8}
.row.a-cleared{border-left-color:var(--ac)}
.ic{font-size:20px}
.rb{flex:1;min-width:0}
.rb .msg{-webkit-line-clamp:2;margin-top:2px;color:var(--mu)}
.tm{color:var(--mu);white-space:nowrap}

aside{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;padding:16px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:10;
  background:linear-gradient(180deg,#151c2e,#0d121d);border-left:1px solid var(--line)}
body.open aside{transform:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shot,.noimg{display:block;width:100%;border-radius:4px;border:1px solid var(--line);background:#080b11}
.noimg{display:grid;place-items:center;height:150px;color:var(--mu)}
.f{margin-top:12px}
.f small{display:block;color:var(--mu);font-size:12px}
.v{user-select:all;word-break:break-all}
.m{user-select:text;white-space:pre-wrap;word-break:break-word;background:#080b11;border:1px solid var(--line);border-radius:4px;padding:10px;margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts button{flex:1 1 30%}
.sb.on.ok{background:linear-gradient(135deg,#23a85e,#146b3b);border-color:#37c978}
.sb.on.no{background:linear-gradient(135deg,#d24848,#8f2626);border-color:#e25b5b}
.sb.on.va{background:linear-gradient(90deg,#1f9d55 15%,#111826 85%);border-color:#37c978}
.del{border-color:#7a3434}

#login{max-width:340px;margin:12vh auto;padding:0 16px;display:grid;gap:10px}
#login h1{font-size:34px;margin:0}
#login small{margin:-6px 0 8px}
#err{color:#ff9a9a;min-height:1.4em;font-size:13px}
#go{background:linear-gradient(135deg,#3b55c9,#6b44c8);border-color:#7a8cff55}
.me{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.me b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me button{width:100%}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;background:linear-gradient(135deg,#3b55c9,#6b44c8);font-weight:700;flex:none}
.pc{padding:14px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,#151c2d,#0e1420)}
.pc .hd{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.pc small{display:block}
.mini{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.mini .stat{padding:10px}
.mini .n{font-size:22px}
.pset{display:grid;gap:10px;justify-items:start;max-width:360px}
.chk{display:flex;gap:8px;align-items:center}
#dl{display:block;margin-top:10px}
.tl{display:flex;gap:10px;align-items:center}
.tb{min-width:0;flex:1}
.tile.s-ai{background:linear-gradient(135deg,#c99a14,#7a5a0c);border-color:#f0c040}
.tile.s-ai small{color:#ffffffc4}
.sb.on.ai{background:linear-gradient(135deg,#c99a14,#7a5a0c);border-color:#f0c040}
.stat.y{background:linear-gradient(145deg,#5a4510,#0f1522)}
.row.a-ai{border-left-color:#e0b020}
.cl{margin:0;padding-left:18px;display:grid;gap:4px}
.ok{color:#4bd18b}
.bad{color:#ff9a9a}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.knob{width:42px;height:24px;border-radius:12px;background:#2a3246;position:relative;transition:background .2s;flex:none}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+.knob{background:linear-gradient(135deg,#3b55c9,#6b44c8)}
.sw input:checked+.knob::after{transform:translateX(18px)}
.sw input:focus-visible+.knob{outline:2px solid var(--ac);outline-offset:2px}
select{background:#0e1420;border:1px solid var(--line);border-radius:6px;padding:9px 11px;color:inherit;font:inherit;max-width:100%}
.addr{display:flex;gap:8px;max-width:420px;margin-bottom:10px}
.addr input{flex:1}
.row.acc{align-items:center}
.row.acc b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#fw{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;min-width:210px;max-height:300px;overflow:auto;z-index:20;padding:6px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,#151c2e,#0d121d);box-shadow:0 12px 30px #000a}
.pop .it{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px}
.pop .it:hover{background:#ffffff12}
.pad{padding:8px 10px}
.zin{animation:zin .22s ease-out}
.zout{animation:zout .17s ease-in forwards}
@keyframes zin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes zout{to{opacity:0;transform:scale(1.35)}}
@media(prefers-reduced-motion:reduce){.zin,.zout{animation:none}}
.pset input:not([type=checkbox]){width:100%}
@media(max-width:760px){.me{display:none}}
@media(max-width:760px){
  #nav{position:static;width:auto;flex-direction:row;overflow-x:auto;padding:8px}
  .brand,.nv small{display:none}
  .nv{white-space:nowrap;padding-right:34px}
  #content{margin-left:0}
  body.open #content{margin-right:0}
  aside{width:100%}
  #q{width:120px}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<form id="login" hidden>
  <h1>Who might you be?</h1>
  <small class="mu">A reference to &ldquo;Who might you be?&rdquo; from Deltarune Chapter 5</small>
  <input id="dn" placeholder="Display name" autocomplete="off" hidden>
  <input id="un" placeholder="Username" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go">Sign in</button>
  <button id="mk" type="button">Create profile</button>
  <div id="err"></div>
</form>
<div id="app" hidden>
<nav id="nav"></nav>
<div id="content">
  <header>
    <button id="back" hidden>Back</button>
    <h1 id="title"></h1>
    <input id="q" placeholder="Find a user">
    <div id="fw" hidden></div>
    <button id="ex" hidden>Export valid</button>
    <span id="st"></span>
    <button id="rf" title="Refresh">Refresh</button>
  </header>
  <main id="main"></main>
</div>
<aside id="side"></aside>
</div>
<script>
const DB=window.__CFG?.db;
if(!DB){document.body.textContent='Open the dashboard through mod-reports-loader.html.';throw new Error('no config')}
const $=s=>document.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k);return e};
let D={},H={},view='home',user=null,sel=null,T,hErr=false,P={},HA={},me=null,lastStats=0,SET={},flt={type:null,val:null},fOpen=false,fLvl='root',LCH={},BOT={};

const TITLE={home:'Main menu',afr:'A.F.R',ai:'AI Assist',launch:'Launcher',hist:'History',all:'All profiles',prof:'Profile settings',log:'Changelogs'};
const NAV=[['home','Main menu','Overview and your stats'],['afr','A.F.R','Automated flagged reports'],['ai','AI Assist','Auto-check with gpt-oss'],['launch','Launcher','Roblox Account Manager'],['hist','History','Every action taken'],['all','All profiles','Everyone\u2019s stats'],['prof','Profile settings','Picture and privacy'],['log','Changelogs','What changed']];
const ACT={resolved:['✅','Resolved'],denied:['❌','Denied'],valid:['👍','Marked valid'],cleared:['↩️','Reopened'],deleted:['🗑','Deleted']};

async function api(path,method='GET',body,qs){
  const r=await fetch(`${DB}${path}.json${qs?'?'+qs:''}`,{method,body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status==401?'Permission denied, check the database rules':'HTTP '+r.status);
  return r.json()}
const stat=(t,bad)=>{const e=$('#st');e.textContent=t;e.style.color=bad?'#ff9a9a':'#4bd18b'};

async function loadHist(){
  try{H=await api('/history','GET',undefined,'orderBy=%22%24key%22&limitToLast=200')||{};hErr=false}catch{hErr=true}}
async function log(action,r,k){
  try{
    await api('/history','POST',{action,reportId:k,displayName:r.displayName??null,username:r.username??null,userId:r.userId??null,text:r.text??null,by:me.k,byName:P[me.k]?.displayName??me.k,t:{'.sv':'timestamp'}});
    await loadHist();render()
  }catch{}}

function groups(ff){
  const m={};
  for(const k in D){const r=D[k];if(ff&&!matches(r))continue;const id=String(r.userId??r.username);(m[id]??=[]).push({...r,k})}
  return Object.entries(m).map(([id,list])=>{list.sort((a,b)=>a.k<b.k?1:-1);return{id,list,name:list[0].displayName,user:list[0].username}})
    .sort((a,b)=>a.list[0].k<b.list[0].k?1:-1)}

function go(v){view=v;user=null;const st=v==='home'||v==='all';if(st)lastStats=0;closeSide();if(st)loadStats().then(render);if(v==='launch')loadLauncher().then(render)}
function paintNav(){
  const open=Object.values(D).filter(r=>!r.status).length;
  $('#nav').replaceChildren(h('div',{className:'brand',textContent:'Mod Reports'}),
    ...NAV.map(([id,t,s])=>h('button',{className:'nv'+(view===id?' on':''),onclick:()=>go(id)},
      h('b',{textContent:t}),h('small',{textContent:s}),
      ...(id==='afr'&&open?[h('span',{className:'bd',textContent:open})]:[]))),
    h('div',{className:'me'},av(P[me.k],34),h('b',{textContent:P[me.k]?.displayName||me.k}),h('button',{textContent:'Sign out',onclick:signout})))}

function render(){
  paintNav();
  const main=$('#main');main.replaceChildren();
  $('#title').textContent=TITLE[view];
  $('#back').hidden=!(view==='afr'&&user);
  $('#q').hidden=!(view==='afr'&&!user);
  $('#ex').hidden=view!=='afr';$('#fw').hidden=view!=='afr';$('#ex').textContent=`Export valid (${Object.values(D).filter(r=>r.status==='valid').length})`;
  ({home:renderHome,afr:renderAfr,hist:renderHist,all:renderAll,prof:renderProf,ai:renderAi,launch:renderLaunch,log:renderLog}[view])(main)}

function renderHome(main){
  const rs=Object.values(D),n=s=>rs.filter(r=>r.status===s&&!r.aiv).length;
  const S=[['Open',rs.filter(r=>!r.status).length,'o'],['Resolved',n('resolved'),'g'],['Denied',n('denied'),'r'],['Valid, can\u2019t act yet',n('valid'),'v'],['AI valid',rs.filter(r=>r.aiv).length,'y'],['Total reports',rs.length,''],['Users flagged',groups().length,'']];
  main.append(
    h('h2',{textContent:'Your stats'}),tiles(statsFor(me.k)),h('h2',{className:'sec',textContent:'Reports overview'}),h('div',{className:'grid stats'},...S.map(([l,v,c])=>h('div',{className:'stat '+c},h('div',{className:'n',textContent:v}),h('small',{textContent:l})))),
    h('h2',{className:'sec',textContent:'Recent activity'}),histList(6))}

function renderHist(main){main.append(histList(200))}

function histList(n){
  if(hErr)return h('p',{className:'mu',textContent:'Can\u2019t read history. Add the /history rules in Firebase.'});
  const es=Object.entries(H).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,n);
  if(!es.length)return h('p',{className:'mu',textContent:'No actions yet.'});
  return h('div',{className:'list'},...es.map(([k,e])=>{
    const[ic,l]=ACT[e.action]||['•',String(e.action)];
    return h('div',{className:'row a-'+e.action},
      h('span',{className:'ic',textContent:ic}),
      h('div',{className:'rb'},h('b',{textContent:`${l}: ${e.displayName||e.username||'unknown'} (@${e.username||'?'})${e.byName?' by '+e.byName:''}`}),h('div',{className:'msg',textContent:e.text??''})),
      h('small',{className:'tm',textContent:e.t?new Date(e.t).toLocaleString():''}))}))}

function renderAfr(main){
  const gs=groups(true),q=$('#q').value.trim().toLowerCase();
  loadHeads(gs.map(g=>g.id));
  if(!user){
    const f=gs.filter(g=>[g.name,g.user,g.id].join(' ').toLowerCase().includes(q));
    main.append(f.length?h('div',{className:'grid'},...f.map(g=>h('button',{className:'tile',onclick:()=>{user=g.id;render()}},
      h('div',{className:'tl'},head(g.id,44,g.name||g.user),h('div',{className:'tb'},h('b',{textContent:g.name||g.user}),h('small',{textContent:'@'+g.user}),
      h('small',{textContent:`${g.list.length} report${g.list.length>1?'s':''}, ${g.list.filter(r=>!r.status).length} open`}))))))
      :h('p',{className:'mu',textContent:Object.keys(D).length?'No user matches that search.':'No reports yet. New ones show up here after the scanner uploads them.'}));
  }else{
    const g=gs.find(x=>x.id===user);if(!g){user=null;return render()}
    main.append(h('div',{className:'tl',style:'margin-bottom:14px'},head(g.id,48,g.name||g.user),h('h2',{style:'margin:0',textContent:`${g.name||g.user} (@${g.user})`})),h('div',{className:'grid'},...g.list.map(r=>
      h('button',{className:`tile s-${r.aiv?'ai':(r.status||'none')}${r.k===sel?' sel':''}`,onclick:()=>openSide(r.k)},
        h('small',{textContent:(r.word?`Flagged: ${r.word}`:'')+(pend[r.k]?' (deleting soon)':'')}),h('div',{className:'msg',textContent:r.text})))));
  }}

function openSide(k){sel=k;document.body.classList.add('open');render();paintSide()}
function closeSide(){clearInterval(T);sel=null;document.body.classList.remove('open');$('#side').replaceChildren();render()}

function paintSide(){
  clearInterval(T);
  const r=D[sel];if(!r)return;
  const src=r.image||r.imageUrl||'';
  const img=/^(data:image\/|https:\/\/)/.test(src)
    ?h('img',{className:'shot',src,referrerPolicy:'no-referrer',onerror(){this.replaceWith(h('div',{className:'noimg',textContent:'Image failed to load'}))}})
    :h('div',{className:'noimg',textContent:'Loading image...'});
  const f=(l,v)=>h('div',{className:'f'},h('small',{textContent:l}),h('span',{className:'v',textContent:v??'-'}));
  const sb=(st,cls,txt,tip)=>h('button',{className:`sb ${cls}${r.status===st?' on':''}`,textContent:txt,title:tip,onclick:()=>setStatus(st)});
  const del=h('button',{className:'del',textContent:'🗑 Delete'}),can=h('button',{textContent:'Cancel',hidden:true});
  const reset=()=>{clearInterval(T);del.disabled=false;del.textContent='🗑 Delete';delete del.dataset.a;can.hidden=true};
  del.onclick=()=>{
    if(del.dataset.a)return doDelete();
    del.dataset.a=1;can.hidden=false;del.disabled=true;let n=2;del.textContent=`Wait ${n}...`;
    T=setInterval(()=>{if(--n>0){del.textContent=`Wait ${n}...`;return}clearInterval(T);del.disabled=false;del.textContent='⚠ Confirm delete'},1000)};
  can.onclick=reset;
  $('#side').replaceChildren(
    h('div',{className:'top'},h('div',{className:'tl'},head(r.userId,36,r.displayName),h('b',{textContent:'Report'})),h('button',{textContent:'✕',title:'Close',onclick:closeSide})),
    img,f('Display name',r.displayName),f('Username',r.username),f('User ID',r.userId),
    h('div',{className:'f'},h('small',{textContent:'Message'}),h('div',{className:'m',textContent:r.text})),
    ...(r.ai?[h('div',{className:'f'},h('small',{textContent:'AI check'}),h('div',{className:'m',textContent:`${String(r.ai.verdict).toUpperCase()}: ${r.ai.reason||''}`}))]:[]),
    h('div',{className:'acts'},sb('resolved','ok','✅ Resolved','Resolved'),sb('denied','no','❌ Denied','Denied'),sb('valid',r.aiv?'va ai':'va','👍 Valid','Valid, can\u2019t act on it now')),
    h('small',{id:'dl',className:'mu',textContent:pend[sel]?dlText(sel):''}),
    h('div',{className:'acts'},del,can));
  if(!src){const id=sel;
    api('/images/'+id).then(d=>{
      const b=$('#side .noimg');if(sel!==id||!b)return;
      if(typeof d==='string'&&d.startsWith('data:image/'))b.replaceWith(h('img',{className:'shot',src:d}));
      else b.textContent='No image'
    }).catch(()=>{const b=$('#side .noimg');if(sel===id&&b)b.textContent='No image'})}}

async function setStatus(st){
  const r=D[sel],k=sel,old=r.status,ai=r.aiv,v=old===st&&!ai?null:st;
  r.status=v;r.aiv=null;render();paintSide();
  try{await api('/reports/'+k,'PATCH',{status:v,aiv:null});log(v||'cleared',r,k);if(v==='resolved'||v==='denied')schedDel(k);else cancelDel(k);render();if(sel===k)paintSide()}
  catch(e){r.status=old;r.aiv=ai;render();paintSide();alert(e.message)}}
async function doDelete(){
  const k=sel,r=D[k];cancelDel(k);
  try{await api('/reports/'+k,'DELETE');delete D[k];api('/images/'+k,'DELETE').catch(()=>{});closeSide();log('deleted',r,k)}catch(e){alert(e.message)}}

const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}};
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch{let a=5381,b=52711;for(const c of s){a=Math.imul(a^c.charCodeAt(0),2654435761);b=Math.imul(b^c.charCodeAt(0),1597334677)}return(a>>>0).toString(16)+(b>>>0).toString(16)}}

function av(p,sz=40){

const PUSH='-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';

    out.push(new Uint8Array(lh.buffer),nm,f.data);

    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);

$('#login').onsubmit=async ev=>{
  ev.preventDefault();err('');
  const u=$('#un').value.trim(),pw=$('#pw').value,k=u.toLowerCase();
  try{
    if(mode==='in'){
      const rec=/^\w+$/.test(k)&&await api('/profiles/'+k);
      if(!rec||rec.pass!==await sha(k+':'+pw))return err('Wrong username or password.');
      enter(k,rec)
    }else{
      const d=$('#dn').value.trim();
      if(!d||!u||!pw)return err('Fill in all three boxes.');
      if(!/^\w{3,20}$/.test(u))return err('Username: 3 to 20 letters, numbers or _');
      if(await api('/profiles/'+k))return err('That username is taken.');
      const rec={displayName:d,username:u,pass:await sha(k+':'+pw),hidden:false};
      await api('/profiles/'+k,'PUT',rec);enter(k,rec)
    }
  }catch(e){err(e.message)}};
let sess=null;try{sess=JSON.parse(ls('me'))}catch{}
if(sess&&/^\w+$/.test(sess.k))api('/profiles/'+sess.k).then(r=>r&&r.pass===sess.h?enter(sess.k,r):showLogin()).catch(showLogin);else showLogin();
</script>
</body>
</html>
