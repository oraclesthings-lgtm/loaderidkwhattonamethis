<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mod Reports</title>
<style>
:root{--bg:#090c13;--card:#121826;--line:#212a3b;--tx:#e6eaf4;--mu:#8793ab;--ac:#6f8cff;--gr:#1f9d55;--rd:#c23b3b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 500px at 85% -10%,#1a2146 0%,transparent 60%),linear-gradient(160deg,#080b11,#0c111b 60%,#090c13);background-attachment:fixed}
input,button{font:inherit;color:inherit}
input{background:#0e1420;border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0}
button{background:linear-gradient(180deg,#182036,#111826);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button:disabled{opacity:.55;cursor:default}
[hidden]{display:none!important}
.mu{color:var(--mu)}

#nav{position:fixed;left:0;top:0;bottom:0;width:208px;padding:16px 12px;display:flex;flex-direction:column;gap:6px;z-index:6;
  background:linear-gradient(180deg,#10163a,#0a0e18 70%);border-right:1px solid var(--line)}
.brand{font-weight:700;font-size:17px;padding:4px 10px 14px}
.nv{position:relative;text-align:left;background:none;border:1px solid transparent;padding:10px 12px;border-radius:8px}
.nv small{display:block;color:var(--mu);font-size:12px}
.nv.on{background:linear-gradient(135deg,#3b55c9,#6b44c8);border-color:#7a8cff55}
.nv.on small{color:#ffffffb8}
.bd{position:absolute;right:10px;top:12px;background:#ffffff22;border-radius:10px;padding:0 7px;font-size:12px}
#content{margin-left:208px}
body.open #content{margin-right:380px}

header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:12px 16px;
  background:linear-gradient(90deg,#0b1020d9,#090c13d9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap}
#q{width:200px}
#st{font-size:12px;white-space:nowrap}
main{padding:16px}
h2{margin:0 0 14px;font-size:18px}
h2.sec{margin-top:28px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{display:block;width:100%;min-height:92px;text-align:left;padding:13px;border-radius:6px;background:linear-gradient(145deg,#171f33,#0f1522)}
.tile b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{display:block;color:var(--mu)}
.tile.s-resolved{background:linear-gradient(135deg,#23a85e,#146b3b);border-color:#37c978}
.tile.s-denied{background:linear-gradient(135deg,#d24848,#8f2626);border-color:#e25b5b}
.tile.s-valid{background:linear-gradient(90deg,#1f9d55 12%,#101725 88%);border-color:#37c978}
.tile.s-resolved small,.tile.s-denied small,.tile.s-valid small{color:#ffffffc4}
.tile.sel{outline:2px solid var(--ac)}
.msg{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;word-break:break-word}

.stats{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.stat{padding:16px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(145deg,#171f33,#0f1522)}
.stat .n{font-size:32px;font-weight:700;line-height:1.1}
.stat small{color:var(--mu)}
.stat.o{background:linear-gradient(145deg,#2a3270,#0f1522)}
.stat.g{background:linear-gradient(145deg,#14502f,#0f1522)}
.stat.r{background:linear-gradient(145deg,#5a1f24,#0f1522)}
.stat.v{background:linear-gradient(90deg,#14502f,#0f1522)}

.list{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-left:3px solid #4a5670;border-radius:8px;background:linear-gradient(145deg,#151c2d,#0e1420)}
.row.a-resolved{border-left-color:#2fbf70}
.row.a-denied{border-left-color:#e25b5b}
.row.a-valid{border-left-color:#8bd3a8}
.row.a-cleared{border-left-color:var(--ac)}
.ic{font-size:20px}
.rb{flex:1;min-width:0}
.rb .msg{-webkit-line-clamp:2;margin-top:2px;color:var(--mu)}
.tm{color:var(--mu);white-space:nowrap}

aside{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;padding:16px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:10;
  background:linear-gradient(180deg,#151c2e,#0d121d);border-left:1px solid var(--line)}
body.open aside{transform:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shot,.noimg{display:block;width:100%;border-radius:4px;border:1px solid var(--line);background:#080b11}
.noimg{display:grid;place-items:center;height:150px;color:var(--mu)}
.f{margin-top:12px}
.f small{display:block;color:var(--mu);font-size:12px}
.v{user-select:all;word-break:break-all}
.m{user-select:text;white-space:pre-wrap;word-break:break-word;background:#080b11;border:1px solid var(--line);border-radius:4px;padding:10px;margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts button{flex:1 1 30%}
.sb.on.ok{background:linear-gradient(135deg,#23a85e,#146b3b);border-color:#37c978}
.sb.on.no{background:linear-gradient(135deg,#d24848,#8f2626);border-color:#e25b5b}
.sb.on.va{background:linear-gradient(90deg,#1f9d55 15%,#111826 85%);border-color:#37c978}
.del{border-color:#7a3434}

#login{max-width:340px;margin:12vh auto;padding:0 16px;display:grid;gap:10px}
#login h1{font-size:34px;margin:0}
#login small{margin:-6px 0 8px}
#err{color:#ff9a9a;min-height:1.4em;font-size:13px}
#go{background:linear-gradient(135deg,#3b55c9,#6b44c8);border-color:#7a8cff55}
.me{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.me b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me button{width:100%}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;background:linear-gradient(135deg,#3b55c9,#6b44c8);font-weight:700;flex:none}
.pc{padding:14px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,#151c2d,#0e1420)}
.pc .hd{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.pc small{display:block}
.mini{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.mini .stat{padding:10px}
.mini .n{font-size:22px}
.pset{display:grid;gap:10px;justify-items:start;max-width:360px}
.chk{display:flex;gap:8px;align-items:center}
#dl{display:block;margin-top:10px}
.tl{display:flex;gap:10px;align-items:center}
.tb{min-width:0;flex:1}
.tile.s-open{background:linear-gradient(135deg,#3d4b6e,#1a2236);border-color:#55648a}
.tile.s-noted{background:linear-gradient(135deg,#8a5cf0,#3d2a73);border-color:#a884ff}
.tile.s-open small,.tile.s-noted small,.tile.ut small{color:#ffffffcc}
.tile.ut{border-color:#ffffff22;text-shadow:0 1px 2px #0008}
.role{display:inline-block;margin-left:6px;padding:0 7px;border-radius:9px;font-size:11px;font-weight:600;vertical-align:2px}
.role.cr{background:linear-gradient(135deg,#f0c040,#c6613f);color:#1a1205}
.role.ad{background:linear-gradient(135deg,#3b55c9,#6b44c8);color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;flex:none}
.mlg{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;color:var(--mu);font-size:13px}
.tile.s-ai{background:linear-gradient(135deg,#c99a14,#7a5a0c);border-color:#f0c040}
.tile.s-ai small{color:#ffffffc4}
.sb.on.ai{background:linear-gradient(135deg,#c99a14,#7a5a0c);border-color:#f0c040}
.stat.y{background:linear-gradient(145deg,#5a4510,#0f1522)}
.row.a-ai{border-left-color:#e0b020}
.wd{margin-top:10px;font-family:Wingdings,'Wingdings 2','Wingdings 3',sans-serif;font-size:18px;letter-spacing:2px;color:var(--mu)}
.pie{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,#151c2d,#0e1420)}
.pie svg{width:200px;height:200px;flex:none}
.pie circle.seg{fill:none;stroke-width:34;transition:stroke-width .15s}
.pie circle.seg:hover{stroke-width:40}
.pie .ctr{fill:var(--tx);font-size:26px;font-weight:700;text-anchor:middle}
.pie .ctr2{fill:var(--mu);font-size:12px;text-anchor:middle}
.lg{display:grid;gap:6px;min-width:200px;max-width:360px;flex:1}
.lg div{display:flex;align-items:center;gap:8px}
.lg i{width:12px;height:12px;border-radius:3px;flex:none}
.lg b{flex:1;font-weight:500}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg2 button{border:0;border-radius:0;background:none;padding:7px 14px}
.seg2 button.on{background:linear-gradient(135deg,#3b55c9,#6b44c8)}
.pin{animation:pin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:rotate(-120deg) scale(.6)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pin{animation:none}}
.cl{margin:0;padding-left:18px;display:grid;gap:4px}
.ok{color:#4bd18b}
.bad{color:#ff9a9a}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.knob{width:42px;height:24px;border-radius:12px;background:#2a3246;position:relative;transition:background .2s;flex:none}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+.knob{background:linear-gradient(135deg,#3b55c9,#6b44c8)}
.sw input:checked+.knob::after{transform:translateX(18px)}
.sw input:focus-visible+.knob{outline:2px solid var(--ac);outline-offset:2px}
select{background:#0e1420;border:1px solid var(--line);border-radius:6px;padding:9px 11px;color:inherit;font:inherit;max-width:100%}
.addr{display:flex;gap:8px;max-width:420px;margin-bottom:10px}
.addr input{flex:1}
.row.acc{align-items:center}
.row.acc b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#fw{position:relative}
.shot{cursor:zoom-in}
.notes{display:grid;gap:8px;max-height:260px;overflow:auto;padding:8px;background:#080b11;border:1px solid var(--line);border-radius:6px;margin-top:4px}
.note{display:flex;gap:8px;align-items:flex-start}
.note .nb{flex:1;min-width:0;background:#141b2b;border-radius:8px;padding:6px 9px}
.note.mine .nb{background:linear-gradient(135deg,#25306a,#1d1f45)}
.note .nb small{display:flex;gap:6px;color:var(--mu);font-size:11px}
.note .nb small b{color:var(--tx);font-weight:600}
.note .nt{white-space:pre-wrap;word-break:break-word;user-select:text}
.note .nx{background:none;border:0;padding:0 2px;color:var(--mu);margin-left:auto;cursor:pointer}
.nin{display:flex;gap:6px;margin-top:6px}
.nimg{display:block;max-width:100%;max-height:180px;margin-top:6px;border-radius:6px;cursor:zoom-in}
.npv{position:relative;display:inline-block;margin-top:6px}
.npv img{display:block;max-height:90px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.npv .nx{position:absolute;top:2px;right:2px;background:#000a;border-radius:4px;color:#fff;padding:0 5px}
.over .notes{outline:2px dashed var(--ac)}
.nin textarea{flex:1;min-width:0;resize:none;height:38px;background:#0e1420;border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:inherit;font:inherit}
#zm{position:fixed;inset:0;z-index:50;background:#000d;overflow:hidden;cursor:grab;touch-action:none;animation:zin .18s ease-out}
#zm img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
#zm .zb{position:fixed;top:12px;right:12px;display:flex;gap:6px;z-index:51}
#zm small{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#ffffffaa}
.pop{position:absolute;top:calc(100% + 6px);left:0;min-width:210px;max-height:300px;overflow:auto;z-index:20;padding:6px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,#151c2e,#0d121d);box-shadow:0 12px 30px #000a}
.pop .it{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px}
.pop .it:hover{background:#ffffff12}
.pad{padding:8px 10px}
.zin{animation:zin .22s ease-out}
.zout{animation:zout .17s ease-in forwards}
@keyframes zin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes zout{to{opacity:0;transform:scale(1.35)}}
@media(prefers-reduced-motion:reduce){.zin,.zout{animation:none}}
.pset input:not([type=checkbox]){width:100%}
.bcs{display:grid;gap:8px;max-width:760px;margin:0 auto 22px;text-align:center}
.bc{padding:12px 16px;border-radius:8px;border:1px solid #6f8cff66;background:linear-gradient(135deg,#1f2a5c,#141a33)}
.bc.warn{border-color:#f0c04088;background:linear-gradient(135deg,#4a3a0e,#1e1a10)}
.bc.imp{border-color:#e25b5b88;background:linear-gradient(135deg,#5a1f24,#1e1214)}
.bcl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#ffffffb0;margin-bottom:4px}
.bc .bt{white-space:pre-wrap;word-break:break-word;font-size:16px}
.bc small{display:block;color:var(--mu);font-size:12px;margin-top:4px}
.bcta{width:100%;resize:vertical;background:#0e1420;border:1px solid var(--line);border-radius:6px;padding:9px 11px;color:inherit;font:inherit}
.mrow{display:grid;gap:10px}
.mh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mh .rb{min-width:160px}
.mact{display:flex;gap:6px;flex-wrap:wrap}
.mact button.on{border-color:var(--ac);background:#25306a}
.mform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mform input{flex:1;min-width:180px}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:9px;font-size:11px;font-weight:600;vertical-align:2px}
.tag.ban{background:#c23b3b;color:#fff}
.tag.wn{background:#c99a14;color:#1a1205}
#wm{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#000c;padding:16px}
#wm .box{max-width:440px;width:100%;padding:20px;border-radius:10px;border:1px solid #f0c04088;background:linear-gradient(160deg,#3a2e0c,#121826 60%);display:grid;gap:10px}
#wm h2{margin:0}
#wm button{background:linear-gradient(135deg,#c99a14,#7a5a0c);border-color:#f0c040}
@media(max-width:760px){.me{display:none}}
@media(max-width:760px){
  #nav{position:static;width:auto;flex-direction:row;overflow-x:auto;padding:8px}
  .brand,.nv small{display:none}
  .nv{white-space:nowrap;padding-right:34px}
  #content{margin-left:0}
  body.open #content{margin-right:0}
  aside{width:100%}
  #q{width:120px}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<form id="login" hidden>
  <h1>Who might you be?</h1>
  <small class="mu">A reference to &ldquo;Who might you be?&rdquo; from Deltarune Chapter 5</small>
  <input id="dn" placeholder="Display name" autocomplete="off" hidden>
  <input id="un" placeholder="Username" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go">Sign in</button>
  <button id="mk" type="button">Create profile</button>
  <div id="err"></div>
</form>
<div id="app" hidden>
<nav id="nav"></nav>
<div id="content">
  <header>
    <button id="back" hidden>Back</button>
    <h1 id="title"></h1>
    <input id="q" placeholder="Find a user">
    <div id="fw" hidden></div>
    <button id="ex" hidden>Export valid</button>
    <button id="rv" hidden>Resolve all valid</button>
    <span id="cd" hidden></span>
    <span id="st"></span>
    <button id="rf" title="Refresh">Refresh</button>
  </header>
  <main id="main"></main>
</div>
<aside id="side"></aside>
</div>
<script>
const DB=window.__CFG?.db;
if(!DB){document.body.textContent='Open the dashboard through mod-reports-loader.html.';throw new Error('no config')}
const $=s=>document.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k);return e};
let D={},H={},view='home',user=null,sel=null,T,hErr=false,P={},HA={},me=null,lastStats=0,SET={},flt={type:null,val:null},fOpen=false,fLvl='root',LCH={},BOT={},B={},W={},ML={},modErr='',modOpen=null;

const TITLE={home:'Main menu',afr:'A.F.R',ai:'AI Assist',launch:'Launcher',hist:'History',all:'All profiles',prof:'Profile settings',log:'Changelogs',bc:'Broadcast',mod:'Moderation'};
const NAV=[['home','Main menu','Overview and your stats'],['afr','A.F.R','Automated flagged reports'],['ai','AI Assist','Auto-check with gpt-oss'],['launch','Launcher','Roblox Account Manager'],['hist','History','Every action taken'],['all','All profiles','Everyone\u2019s stats'],['prof','Profile settings','Picture and privacy'],['bc','Broadcast','Messages on the Main menu'],['mod','Moderation','Warn, kick and ban'],['log','Changelogs','What changed']];
// Tabs only the Creator and Administrators can see or open
const STAFF=new Set(['bc','mod']);
const ACT={resolved:['✅','Resolved'],denied:['❌','Denied'],valid:['👍','Marked valid'],cleared:['↩️','Reopened'],deleted:['🗑','Deleted']};

async function api(path,method='GET',body,qs){
  const r=await fetch(`${DB}${path}.json${qs?'?'+qs:''}`,{method,body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status==401?'Permission denied, check the database rules':'HTTP '+r.status);
  return r.json()}
const stat=(t,bad)=>{const e=$('#st');e.textContent=t;e.style.color=bad?'#ff9a9a':'#4bd18b'};

async function loadHist(){
  try{H=await api('/history','GET',undefined,'orderBy=%22%24key%22&limitToLast=200')||{};hErr=false}catch{hErr=true}}
async function log(action,r,k){
  try{
    await api('/history','POST',{action,reportId:k,displayName:r.displayName??null,username:r.username??null,userId:r.userId??null,text:r.text??null,word:r.word??null,by:me.k,byName:P[me.k]?.displayName??me.k,t:{'.sv':'timestamp'}});
    await loadHist();render()
  }catch{}}

function groups(ff){
  const m={};
  for(const k in D){const r=D[k];if(ff&&!matches({...r,k}))continue;const id=String(r.userId??r.username);(m[id]??=[]).push({...r,k})}
  return Object.entries(m).map(([id,list])=>{list.sort((a,b)=>a.k<b.k?1:-1);return{id,list,name:list[0].displayName,user:list[0].username}})
    .sort((a,b)=>a.list[0].k<b.list[0].k?1:-1)}

function go(v){view=v;user=null;const st=v==='home'||v==='all';if(st)lastStats=0;closeSide();if(st)loadStats().then(render);if(v==='mod')loadMod().then(render);if(v==='launch'){lAnim=true;loadLauncher().then(()=>{render();lAnim=false})}}
function paintNav(){
  const open=Object.values(D).filter(r=>!r.status).length;
  $('#nav').replaceChildren(h('div',{className:'brand',textContent:'Mod Reports'}),
    ...NAV.filter(([id])=>!STAFF.has(id)||canManage()).map(([id,t,s])=>h('button',{className:'nv'+(view===id?' on':''),onclick:()=>go(id)},
      h('b',{textContent:t}),h('small',{textContent:s}),
      ...(id==='afr'&&open?[h('span',{className:'bd',textContent:open})]:[]))),
    h('div',{className:'me'},av(P[me.k],34),h('b',{textContent:P[me.k]?.displayName||me.k},roleTag(me.k)),h('button',{textContent:'Sign out',onclick:signout})))}

function render(){
  if(STAFF.has(view)&&!canManage())view='home';
  paintNav();
  const main=$('#main');main.replaceChildren();
  $('#title').textContent=TITLE[view];
  $('#back').hidden=!(view==='afr'&&user);
  $('#q').hidden=!(view==='afr'&&!user);
  $('#ex').hidden=view!=='afr';{const n=Object.values(D).filter(r=>r.status==='valid').length;$('#rv').hidden=view!=='afr';$('#rv').disabled=!n;$('#rv').textContent=`✅ Resolve all valid (${n})`}$('#fw').hidden=view!=='afr';$('#ex').textContent=`Export valid (${Object.values(D).filter(r=>r.status==='valid').length})`;
  ({home:renderHome,afr:renderAfr,hist:renderHist,all:renderAll,prof:renderProf,ai:renderAi,launch:renderLaunch,log:renderLog,bc:renderBc,mod:renderMod}[view])(main)}

function renderHome(main){
  const rs=Object.values(D),n=s=>rs.filter(r=>r.status===s&&!r.aiv).length;

function statsFor(k){

  const s={resolved:0,denied:0,valid:0,today:0,month:0,year:0,life:0},n=new Date(),cur={},vBy={},U={resolved:new Set(),denied:new Set(),valid:new Set()};
  for(const id of Object.keys(HA).sort()){

    if(e.action==='cleared'){delete cur[rid];delete vBy[rid]}
    else if(['resolved','denied','valid'].includes(e.action)){cur[rid]=e;if(e.action==='valid')vBy[rid]=e}}
  // Whoever validated a report keeps that credit when someone else resolves it later
  const list=Object.keys(cur).map(rid=>cur[rid]);
  for(const rid in cur)if(cur[rid].action==='resolved'&&vBy[rid]&&vBy[rid].by!==cur[rid].by)list.push(vBy[rid]);
  for(const e of list){
    if(e.by!==k)continue;
    s[e.action]++;s.life++;U[e.action].add(String(e.userId??e.username));const d=new Date(e.t);
    if(d.getFullYear()===n.getFullYear()){s.year++;if(d.getMonth()===n.getMonth()){s.month++;if(d.getDate()===n.getDate())s.today++}}}
  s.uResolved=U.resolved.size;s.uDenied=U.denied.size;s.uValid=U.valid.size;
  return s}

    const dir=String(r.username||r.userId||'unknown').replace(/[^\w.-]/g,'_').replace(/^\.+/,'_'),base=`${dir}/${day}_${tm.replaceAll(':','-')}_${k}`;
    const pk=String(r.userId??r.username);(pl[pk]??={displayName:r.displayName,username:r.username,userId:r.userId,dir,reports:[]}).reports.push({t:pushTime(k),word:r.word,text:r.text,img:im,vb:whoValid(k,r),notes:Object.values(await api('/notes/'+k).catch(()=>null)||{}).sort((a,b)=>(a.t||0)-(b.t||0))});
    files.push({name:base+'.txt',data:te.encode(`[${day} ${tm}]\nDisplay Name: ${r.displayName}\nUsername: @${r.username}\nUser ID: ${r.userId}\nWord Detected: ${r.word??''}\nMessage: "${r.text}"\nValidated by: ${whoValid(k,r)}\n`)});
    files.push({name:`${base}.${m[1]==='jpeg'?'jpg':m[1]}`,data:Uint8Array.from(atob(m[2]),c=>c.charCodeAt(0))})
  }
  const players=Object.values(pl);
  if(!players.length)return{blob:null,skipped};
  players.forEach(p=>p.reports.sort((a,b)=>a.t-b.t));players.sort((a,b)=>a.reports[0].t-b.reports[0].t);
  const cs=buildCases(players);
  files.unshift({name:'REPORT-ARREST CASE.html',data:te.encode(cs.main)});
  for(const c of cs.per)files.push({name:`${c.dir}/REPORT-ARREST CASE - ${c.dir}.html`,data:te.encode(c.html)});
  return{blob:zip(files),skipped,count:entries.length-skipped,cases:cs}}
const saveBlob=(blob,name)=>h('a',{href:URL.createObjectURL(blob),download:name}).click();

async function exportValid(){
  const vs=Object.entries(D).filter(([k,r])=>r.status==='valid');
  if(!vs.length)return alert('No valid reports to export yet.');
  const b=$('#ex');b.disabled=true;b.textContent='Exporting...';
  try{
    const x=await buildExport(vs);
    if(!x.blob)alert('None of the valid reports have a screenshot, so there is nothing to export.');
    else{saveBlob(x.blob,`valid-reports-${new Date().toISOString().slice(0,10)}.zip`);
      if(x.skipped)alert(`Exported ${x.count} report${x.count>1?'s':''}. Left out ${x.skipped} without a screenshot.`)}
  }catch(e){alert(e.message)}
  b.disabled=false;render()}

// Download one report, or all of a player's valid reports
async function downloadEntries(getEntries,base,btn,mode){
  const entries=getEntries();
  if(!entries.length)return alert('There are no valid reports for this player.');
  const label=btn.textContent;btn.disabled=true;btn.textContent='Preparing...';
  try{
    const x=await buildExport(entries),name=base.replace(/[^\w.-]/g,'_');
    if(!x.blob)alert(entries.length>1?'None of these reports have a screenshot, so there is nothing to download.':'This report has no screenshot, so it can’t be downloaded.');
    else{
      if(mode==='html')saveBlob(new Blob([x.cases.per[0].html],{type:'text/html'}),name+'.html');
      else saveBlob(x.blob,name+'.zip');
      if(x.skipped)alert(`Downloaded ${x.count} report${x.count>1?'s':''}. Left out ${x.skipped} without a screenshot.`)}
  }catch(e){alert(e.message)}
  btn.disabled=false;btn.textContent=label}
function dlPicker(getEntries,base,label){
  const box=h('div',{className:'acts'});
  const swap=(build)=>{box.classList.remove('zin');box.classList.add('zout');setTimeout(()=>{box.classList.remove('zout');box.replaceChildren(...build());void box.offsetWidth;box.classList.add('zin')},170)};
  const main=()=>[h('button',{textContent:label,onclick:()=>swap(opts)})];
  const opts=()=>[
    h('button',{textContent:'🗜 As Zip',title:'Reports, screenshots and Report/Arrest Case file',onclick:e=>downloadEntries(getEntries,base,e.currentTarget,'zip')}),
    h('button',{textContent:'📄 As HTML',title:'Just the Report/Arrest Case file, with the screenshots inside',onclick:e=>downloadEntries(getEntries,base,e.currentTarget,'html')}),
    h('button',{textContent:'✕',title:'Back',style:'flex:0 0 auto',onclick:()=>swap(main)})];
  box.replaceChildren(...main());return box}
function pickPfp(f){
  if(!f)return;const im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const m=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);patchMe({pfp:c.toDataURL('image/jpeg',.85)})};
  im.src=URL.createObjectURL(f)}
async function patchMe(o){try{await api('/profiles/'+me.k,'PATCH',o);Object.assign(P[me.k],o);render();return true}catch(e){alert(e.message);return false}}

async function load(){
  if(!me)return;
  try{D=await api('/reports')||{};stat('Live')}catch(e){stat(e.message,1);return}
  try{P=await api('/profiles')||{}}catch{}
  if(guard(P[me.k]))return;
  try{B=await api('/broadcasts')||{}}catch{}
  if(view==='mod')await loadMod();
  checkWarns();
  try{SET=await api('/settings')||{}}catch{}
  try{NOTED=new Set(Object.keys(await api('/notes','GET',undefined,'shallow=true')||{}))}catch{}
  await loadHist();
  if((view==='home'||view==='all')&&Date.now()-lastStats>60000)await loadStats();
  if(view==='launch')await loadLauncher();
  if(sel&&!D[sel])closeSide();else if(!busy())render()}

$('#rf').onclick=load;$('#ex').onclick=exportValid;$('#rv').onclick=resolveAllValid;$('#q').oninput=render;
$('#back').onclick=()=>{user=null;render()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)closeSide()});
addEventListener('click',()=>{if(fOpen){fOpen=false;paintFlt()}if(bOpen){bOpen=false;render()}});
setInterval(()=>{if(!document.hidden)load()},20000);
setInterval(()=>{if(!document.hidden&&me&&view==='launch')loadLauncher().then(()=>{if(view==='launch'&&!busy())render()})},5000);
setInterval(()=>{const n=$('#dl');if(n&&pend[sel])n.textContent=dlText(sel);paintCd()},1000);
function paintCd(){
  const ks=Object.keys(pend),c=$('#cd');if(!c)return;
  if(ks.length<2){c.hidden=true;return}
  const left=Math.max(0,Math.ceil((Math.max(...ks.map(k=>pend[k].at))-Date.now())/1000));
  c.hidden=false;c.replaceChildren(h('small',{className:'bad',textContent:`Deleting ${ks.length} reports in ${left}s `}),
    h('button',{textContent:'Cancel',onclick:()=>{ks.forEach(cancelDel);render()}}));
  document.querySelectorAll('.tile small').forEach(e=>{e.textContent=e.textContent.replace(/deleting in \d+s/,m=>'deleting in '+left+'s')})}
let mode='in';
const err=t=>{$('#err').textContent=t};
function setMode(m){mode=m;$('#dn').hidden=m==='in';$('#go').textContent=m==='in'?'Sign in':'Create profile';$('#mk').textContent=m==='in'?'Create profile':'Back to sign in';err('')}
function enter(k,rec,kn){
  if(banOn(rec.ban)){ls('me',null);showLogin();return err(banMsg(rec.ban))}
  kn??=rec.kickN||0;
  if((rec.kickN||0)>kn){ls('me',null);showLogin();return err(kickMsg(rec.kick)+' Sign in again.')}
  me={k,kn};P[k]=rec;ls('me',JSON.stringify({k,h:rec.pass,kn}));$('#login').hidden=true;$('#app').hidden=false;render();paintFlt();load()}
function signout(){ls('me',null);location.reload()}
function showLogin(){$('#login').hidden=false;const m=ls('kickmsg');if(m){ls('kickmsg',null);err(m)}}
$('#mk').onclick=()=>setMode(mode==='in'?'new':'in');
$('#login').onsubmit=async ev=>{
  ev.preventDefault();err('');
  const u=$('#un').value.trim(),pw=$('#pw').value,k=u.toLowerCase();
  try{
    if(mode==='in'){
      const rec=/^\w+$/.test(k)&&await api('/profiles/'+k);
      if(!rec||rec.pass!==await sha(k+':'+pw))return err('Wrong username or password.');
      enter(k,rec)
    }else{
      const d=$('#dn').value.trim();
      if(!d||!u||!pw)return err('Fill in all three boxes.');
      if(!/^\w{3,20}$/.test(u))return err('Username: 3 to 20 letters, numbers or _');
      if(await api('/profiles/'+k))return err('That username is taken.');
      const rec={displayName:d,username:u,pass:await sha(k+':'+pw),hidden:false};
      await api('/profiles/'+k,'PUT',rec);enter(k,rec)
    }
  }catch(e){err(e.message)}};
let sess=null;try{sess=JSON.parse(ls('me'))}catch{}
if(sess&&/^\w+$/.test(sess.k))api('/profiles/'+sess.k).then(r=>r&&r.pass===sess.h?enter(sess.k,r,sess.kn):showLogin()).catch(showLogin);else showLogin();
</script>
